[build]
  base    = "."
  command = "corepack enable && pnpm install && pnpm --filter @workspace/hk-masters-web run build"
  publish = "artifacts/hk-masters-web/dist/public"

[build.environment]
  NODE_VERSION        = "20"
  BASE_PATH           = "/"
  VITE_API_BASE_URL   = "https://masters-world-hub.replit.app"

[[edge_functions]]
  function = "og-inject"
  path     = "/journal/*"

[[redirects]]
  from   = "/sitemap.xml"
  to     = "https://masters-world-hub.replit.app/sitemap.xml"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/*"
  to     = "https://masters-world-hub.replit.app/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
