[build]
  base    = "."
  command = "corepack enable && pnpm install && pnpm --filter @workspace/hk-masters-web run build"
  publish = "artifacts/hk-masters-web/dist"

[build.environment]
  NODE_VERSION        = "20"
  BASE_PATH           = "/"
  VITE_API_BASE_URL   = "https://masters-world-hub.replit.app"

[[redirects]]
  from   = "/api/*"
  to     = "https://masters-world-hub.replit.app/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
