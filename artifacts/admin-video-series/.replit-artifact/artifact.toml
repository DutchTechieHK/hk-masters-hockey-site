kind = "video"
previewPath = "/admin-video-series/"
title = "Admin Tutorial Videos"
version = "1.0.0"
id = "artifacts/admin-video-series"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin-video-series/" ]
localPort = 20234

[services.development]
run = "pnpm --filter @workspace/admin-video-series run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin-video-series", "run", "build" ]
publicDir = "artifacts/admin-video-series/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20234"
BASE_PATH = "/admin-video-series/"
