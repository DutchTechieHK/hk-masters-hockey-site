<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1E3A6E" />
  <title>Offline — HK Masters Hockey</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1E3A6E;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo { width: 80px; height: 80px; border-radius: 16px; background: rgba(255,255,255,0.1); padding: 8px; margin-bottom: 1.5rem; object-fit: contain; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.95rem; color: rgba(255,255,255,0.72); line-height: 1.6; max-width: 320px; margin: 0 auto; }
    .badge { display: inline-block; background: rgba(255,255,255,0.12); border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1.25rem; }
    button {
      margin-top: 2rem;
      background: #fff;
      color: #1E3A6E;
      border: none;
      padding: 0.7rem 2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #dce8ff; }
  </style>
</head>
<body>
  <img src="/logo.png" alt="HK Masters Hockey" class="logo" />
  <span class="badge">No connection</span>
  <h1>You're offline</h1>
  <p>Check your internet connection and try again. Cached pages are still available from the home screen.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
