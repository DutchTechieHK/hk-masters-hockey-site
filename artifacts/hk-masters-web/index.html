<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>HK Masters Hockey</title>
    <meta name="description" content="Stories, articles, and photos from the HK Masters Hockey community." />
    <!-- Open Graph defaults (overridden dynamically on article pages) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HK Masters Hockey" />
    <meta property="og:title" content="HK Masters Hockey" />
    <meta property="og:description" content="Stories, articles, and photos from the HK Masters Hockey community." />
    <meta property="og:image" content="/opengraph.jpg" />
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HK Masters Hockey" />
    <meta name="twitter:description" content="Stories, articles, and photos from the HK Masters Hockey community." />
    <meta name="twitter:image" content="/opengraph.jpg" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA -->
    <meta name="theme-color" content="#1E3A6E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HK Masters" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Fillout form embed — popup trigger for Fun Run registration -->
    <script src="https://server.fillout.com/embed/v1/" async></script>
    <!-- Cloudinary upload widget — preloaded so it's ready before players click Upload -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" async></script>
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-Mly_dvzTuvS9Wx8oDkpFx.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
    <!-- Netlify Identity Widget: handles password reset, invites, and email confirmation -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function (user) {
          if (!user) {
            window.netlifyIdentity.on('login', function () {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection at build time -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
