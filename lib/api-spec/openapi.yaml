openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: HK 2026 Masters World Cup API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: teams
    description: Team operations
  - name: players
    description: Player operations
  - name: kits
    description: Kit & clothing operations
  - name: fundraising
    description: Fundraising operations
  - name: logistics
    description: Logistics operations
  - name: dashboard
    description: Dashboard operations
  - name: sponsors
    description: Sponsor operations
  - name: matches
    description: Match schedule operations
  - name: announcements
    description: In-app announcement operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List announcements visible to the current admin or active player
      responses:
        "200":
          description: Visible announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    patch:
      operationId: updateAnnouncement
      tags: [announcements]
      summary: Update an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Announcement deleted

  /announcements/recipient-count:
    get:
      operationId: getAnnouncementRecipientCount
      tags: [announcements]
      summary: Count active players in an announcement audience
      parameters:
        - name: teamId
          in: query
          schema:
            type: integer
        - name: membershipSection
          in: query
          schema:
            type: string
            enum: [men, women]
      responses:
        "200":
          description: Active player recipient count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementRecipientCount"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeam"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    put:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeam"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /teams/{id}/squad:
    get:
      operationId: listCurrentSquadCandidates
      tags: [teams]
      summary: List current members and their squad selection status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current members eligible for squad selection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SquadCandidate"
        "401":
          description: Admin authentication required
        "404":
          description: Masters Div. 1 squad not found
        "409":
          description: Current membership season is not configured

  /teams/{id}/squad/{playerId}:
    put:
      operationId: updateCurrentSquadSelection
      tags: [teams]
      summary: Add or remove a current member from the squad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SquadSelectionUpdate"
      responses:
        "200":
          description: Updated squad selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquadCandidate"
        "401":
          description: Admin authentication required
        "404":
          description: Masters Div. 1 squad or current member not found
        "409":
          description: Current season is unavailable or the member is no longer eligible

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
        - name: position
          in: query
          required: false
          schema:
            type: string
            enum: [Goalkeeper, Defender, Midfield, Forward]
        - name: membershipSection
          in: query
          required: false
          schema:
            type: string
            enum: [not_set, men, women]
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayer"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/membership-sections:
    patch:
      operationId: bulkAssignMembershipSection
      tags: [players]
      summary: Assign a membership section to multiple members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipSectionAssignment"
      responses:
        "200":
          description: Membership sections assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipSectionAssignmentResult"
        "401":
          description: Admin authentication required
        "409":
          description: Current membership season is unavailable

  /players/send-travel-reminders:
    post:
      operationId: sendTravelReminders
      tags: [players]
      summary: Send travel reminder emails to players missing flight info
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelReminderRequest"
      responses:
        "200":
          description: Result of sending reminders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelReminderResult"
        "401":
          description: Not authenticated

  /players/send-onboarding-invites:
    post:
      operationId: sendOnboardingInvites
      tags: [players]
      summary: Send onboarding invite emails (self-service link) to players
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInviteRequest"
      responses:
        "200":
          description: Result of sending invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingInviteResult"
        "401":
          description: Not authenticated

  /players/send-fee-reminders:
    post:
      operationId: sendFeeReminders
      tags: [players]
      summary: Send fee reminder emails to players who haven't paid yet
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeReminderRequest"
      responses:
        "200":
          description: Result of sending reminders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeReminderResult"
        "401":
          description: Not authenticated

  /players/send-insurance-reminders:
    post:
      operationId: sendInsuranceReminders
      tags: [players]
      summary: Send insurance detail reminder emails to players missing insurance info
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsuranceReminderRequest"
      responses:
        "200":
          description: Result of sending reminders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeReminderResult"
        "401":
          description: Not authenticated

  /players/membership/initialize:
    post:
      operationId: initializeMemberships
      tags: [players]
      summary: Create standard seasons and backfill existing member participation records
      responses:
        "200":
          description: Membership foundation is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipInitializationResult"

  /players/membership/interest-submissions:
    get:
      operationId: listMembershipInterestSubmissions
      tags: [players]
      summary: List membership interest submissions
      responses:
        "200":
          description: Interest submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipInterestSubmission"
    post:
      operationId: importMembershipInterestSubmissions
      tags: [players]
      summary: Import and match membership interest submissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInterestImport"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipInterestImportResult"

  /players/membership/notion-sync:
    get:
      operationId: getNotionMembershipSyncStatus
      tags: [players]
      summary: Get the latest Notion membership sync status
      responses:
        "200":
          description: Notion membership sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotionMembershipSyncStatus"
    post:
      operationId: syncNotionMemberships
      tags: [players]
      summary: Run the Notion membership sync now
      responses:
        "200":
          description: Notion membership sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotionMembershipSyncResult"
        "409":
          description: A Notion membership sync is already running
        "503":
          description: Notion membership sync is not configured

  /players/membership/interest-submissions/{id}:
    patch:
      operationId: resolveMembershipInterestSubmission
      tags: [players]
      summary: Resolve an interest submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInterestResolution"
      responses:
        "200":
          description: Resolved submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipInterestSubmission"

  /players/self/{token}:
    get:
      operationId: getSelfPlayer
      tags: [players]
      summary: Get a player's editable details by access token (no auth)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Self-service player view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfPlayer"
        "404":
          description: Token not found
    patch:
      operationId: updateSelfPlayer
      tags: [players]
      summary: Update a player's editable details via access token (no auth)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSelfPlayer"
      responses:
        "200":
          description: Updated self-service player view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfPlayer"
        "404":
          description: Token not found

  /players/{id}/payments:
    get:
      operationId: listPlayerPayments
      tags: [players]
      summary: List recorded payments for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player payment history (most recent first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerPayment"
        "404":
          description: Player not found
    post:
      operationId: createPlayerPayment
      tags: [players]
      summary: Record a new payment for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerPayment"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerPayment"
        "404":
          description: Player not found

  /players/{id}/membership-payments:
    get:
      operationId: listMembershipPayments
      tags: [players]
      summary: List 2026/27 membership payments for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current membership payment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerPayment"
    post:
      operationId: createMembershipPayment
      tags: [players]
      summary: Record a 2026/27 membership payment for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerPayment"
      responses:
        "201":
          description: Created membership payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerPayment"
  /players/{id}/participations:
    get:
      operationId: listPlayerParticipations
      tags: [players]
      summary: List current and archived participation records for a member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Participation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerParticipation"

  /players/{playerId}/payments/{paymentId}:
    delete:
      operationId: deletePlayerPayment
      tags: [players]
      summary: Delete a recorded payment for a player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Payment not found

  /players/{playerId}/membership-payments/{paymentId}:
    delete:
      operationId: deleteMembershipPayment
      tags: [players]
      summary: Delete a recorded 2026/27 membership payment
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Membership payment not found

  /players/{id}/access-token:
    get:
      operationId: getPlayerAccessToken
      tags: [players]
      summary: Get a player's self-service access token (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Access token for the player
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    nullable: true
                required: [accessToken]
        "401":
          description: Unauthorized
        "404":
          description: Player not found

  /players/{id}:
    put:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayer"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Archive a member without deleting their permanent identity or linked history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /kits:
    get:
      operationId: listKits
      tags: [kits]
      summary: List all kit orders
      parameters:
        - name: playerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of kit orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KitOrder"
    post:
      operationId: createKit
      tags: [kits]
      summary: Create a kit order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKitOrder"
      responses:
        "201":
          description: Created kit order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitOrder"

  /kits/distributions:
    get:
      operationId: listKitDistributions
      tags: [kits]
      summary: List all kit distributions
      responses:
        "200":
          description: List of kit distributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KitDistribution"

  /kits/distributions/{playerId}/{itemType}:
    put:
      operationId: upsertKitDistribution
      tags: [kits]
      summary: Upsert (record) a kit distribution for a player+item
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: itemType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertKitDistribution"
      responses:
        "200":
          description: Recorded distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitDistribution"
    delete:
      operationId: deleteKitDistribution
      tags: [kits]
      summary: Delete a kit distribution record
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: itemType
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /kits/{id}:
    put:
      operationId: updateKit
      tags: [kits]
      summary: Update a kit order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKitOrder"
      responses:
        "200":
          description: Updated kit order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitOrder"
    delete:
      operationId: deleteKit
      tags: [kits]
      summary: Delete a kit order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /fundraising:
    get:
      operationId: listFundraising
      tags: [fundraising]
      summary: List all fundraising entries
      responses:
        "200":
          description: List of fundraising entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FundraisingEntry"
    post:
      operationId: createFundraising
      tags: [fundraising]
      summary: Create a fundraising entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFundraisingEntry"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundraisingEntry"

  /fundraising/{id}:
    put:
      operationId: updateFundraising
      tags: [fundraising]
      summary: Update a fundraising entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFundraisingEntry"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundraisingEntry"
    delete:
      operationId: deleteFundraising
      tags: [fundraising]
      summary: Delete a fundraising entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /logistics:
    get:
      operationId: listLogistics
      tags: [logistics]
      summary: List all logistics tasks
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of logistics tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogisticsTask"
    post:
      operationId: createLogisticsTask
      tags: [logistics]
      summary: Create a logistics task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLogisticsTask"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsTask"

  /logistics/{id}:
    put:
      operationId: updateLogisticsTask
      tags: [logistics]
      summary: Update a logistics task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLogisticsTask"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsTask"
    delete:
      operationId: deleteLogisticsTask
      tags: [logistics]
      summary: Delete a logistics task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all matches
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Create a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatch"
      responses:
        "201":
          description: Created match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}:
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatch"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    delete:
      operationId: deleteMatch
      tags: [matches]
      summary: Delete a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sponsors:
    get:
      operationId: listSponsors
      tags: [sponsors]
      summary: List all sponsors
      responses:
        "200":
          description: List of sponsors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sponsor"
    post:
      operationId: createSponsor
      tags: [sponsors]
      summary: Create a sponsor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSponsor"
      responses:
        "201":
          description: Created sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"

  /sponsors/{id}:
    put:
      operationId: updateSponsor
      tags: [sponsors]
      summary: Update a sponsor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSponsor"
      responses:
        "200":
          description: Updated sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
    delete:
      operationId: deleteSponsor
      tags: [sponsors]
      summary: Delete a sponsor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    Announcement:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        teamId:
          type: [integer, "null"]
        teamName:
          type: [string, "null"]
        membershipSection:
          type: [string, "null"]
          enum: [men, women, null]
        pinned:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, body, teamId, teamName, membershipSection, pinned, createdAt, updatedAt]

    AnnouncementInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
        teamId:
          type: [integer, "null"]
        membershipSection:
          type: [string, "null"]
          enum: [men, women, null]
        pinned:
          type: boolean
        sendPush:
          type: boolean
      required: [title, body]

    AnnouncementRecipientCount:
      type: object
      properties:
        recipientCount:
          type: integer
          minimum: 0
      required: [recipientCount]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TravelReminderRequest:
      type: object
      properties:
        playerIds:
          type: array
          items:
            type: integer
          description: Specific player IDs to email. If omitted, emails all players missing flight info.

    TravelReminderResult:
      type: object
      properties:
        sent:
          type: integer
        failed:
          type: integer
        total:
          type: integer
      required:
        - sent
        - failed
        - total

    OnboardingInviteRequest:
      type: object
      properties:
        playerIds:
          type: array
          items:
            type: integer
          description: Specific player IDs to email. If omitted, emails all players who have not yet been sent an onboarding invite.

    MembershipSectionAssignment:
      type: object
      required: [playerIds, membershipSection]
      properties:
        playerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
        membershipSection:
          type: string
          enum: [not_set, men, women]

    MembershipSectionAssignmentResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          description: Number of members whose section changed.

    OnboardingInviteResult:
      type: object
      properties:
        sent:
          type: integer
        failed:
          type: integer
        skippedNoEmail:
          type: integer
        total:
          type: integer
      required:
        - sent
        - failed
        - total

    FeeReminderRequest:
      type: object
      properties:
        playerIds:
          type: array
          items:
            type: integer
          description: Specific player IDs to email. If omitted, emails all players whose fee is unpaid.

    InsuranceReminderRequest:
      type: object
      properties:
        playerIds:
          type: array
          items:
            type: integer
          description: Specific player IDs to email. If omitted, emails all players missing insurance info.

    FeeReminderResult:
      type: object
      properties:
        sent:
          type: integer
        failed:
          type: integer
        total:
          type: integer
      required:
        - sent
        - failed
        - total

    DashboardStats:
      type: object
      properties:
        totalPlayers:
          type: integer
        playersPaidCount:
          type: integer
        feesAmountDue:
          type: number
        feesAmountPaid:
          type: number
        feesAmountOutstanding:
          type: number
        upcomingMatchCount:
          type: integer
