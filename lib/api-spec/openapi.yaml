openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: HK 2026 Masters World Cup API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: teams
    description: Team operations
  - name: players
    description: Player operations
  - name: kits
    description: Kit & clothing operations
  - name: fundraising
    description: Fundraising operations
  - name: logistics
    description: Logistics operations
  - name: dashboard
    description: Dashboard operations
  - name: sponsors
    description: Sponsor operations
  - name: matches
    description: Match schedule operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeam"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    put:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeam"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayer"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/send-travel-reminders:
    post:
      operationId: sendTravelReminders
      tags: [players]
      summary: Send travel reminder emails to players missing flight info
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTravelRemindersBody"
      responses:
        "200":
          description: Result of sending reminders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelReminderResult"
        "401":
          description: Not authenticated

  /players/send-onboarding-invites:
    post:
      operationId: sendOnboardingInvites
      tags: [players]
      summary: Send onboarding invite emails (self-service link) to players
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOnboardingInvitesBody"
      responses:
        "200":
          description: Result of sending invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingInviteResult"
        "401":
          description: Not authenticated

  /players/send-fee-reminders:
    post:
      operationId: sendFeeReminders
      tags: [players]
      summary: Send fee reminder emails to players who haven't paid yet
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFeeRemindersBody"
      responses:
        "200":
          description: Result of sending reminders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeReminderResult"
        "401":
          description: Not authenticated

  /players/self/{token}:
    get:
      operationId: getSelfPlayer
      tags: [players]
      summary: Get a player's editable details by access token (no auth)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Self-service player view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfPlayer"
        "404":
          description: Token not found
    patch:
      operationId: updateSelfPlayer
      tags: [players]
      summary: Update a player's editable details via access token (no auth)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSelfPlayer"
      responses:
        "200":
          description: Updated self-service player view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfPlayer"
        "404":
          description: Token not found

  /players/{id}/payments:
    get:
      operationId: listPlayerPayments
      tags: [players]
      summary: List recorded payments for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player payment history (most recent first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerPayment"
        "404":
          description: Player not found
    post:
      operationId: createPlayerPayment
      tags: [players]
      summary: Record a new payment for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerPayment"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerPayment"
        "404":
          description: Player not found

  /players/{playerId}/payments/{paymentId}:
    delete:
      operationId: deletePlayerPayment
      tags: [players]
      summary: Delete a recorded payment for a player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Payment not found

  /players/{id}/access-token:
    get:
      operationId: getPlayerAccessToken
      tags: [players]
      summary: Get a player's self-service access token (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Access token for the player
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    nullable: true
                required: [accessToken]
        "401":
          description: Unauthorized
        "404":
          description: Player not found

  /players/{id}:
    put:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayer"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Delete a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /kits:
    get:
      operationId: listKits
      tags: [kits]
      summary: List all kit orders
      parameters:
        - name: playerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of kit orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KitOrder"
    post:
      operationId: createKit
      tags: [kits]
      summary: Create a kit order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKitOrder"
      responses:
        "201":
          description: Created kit order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitOrder"

  /kits/distributions:
    get:
      operationId: listKitDistributions
      tags: [kits]
      summary: List all kit distributions
      responses:
        "200":
          description: List of kit distributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KitDistribution"

  /kits/distributions/{playerId}/{itemType}:
    put:
      operationId: upsertKitDistribution
      tags: [kits]
      summary: Upsert (record) a kit distribution for a player+item
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: itemType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertKitDistribution"
      responses:
        "200":
          description: Recorded distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitDistribution"
    delete:
      operationId: deleteKitDistribution
      tags: [kits]
      summary: Delete a kit distribution record
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: itemType
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /kits/{id}:
    put:
      operationId: updateKit
      tags: [kits]
      summary: Update a kit order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKitOrder"
      responses:
        "200":
          description: Updated kit order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitOrder"
    delete:
      operationId: deleteKit
      tags: [kits]
      summary: Delete a kit order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /fundraising:
    get:
      operationId: listFundraising
      tags: [fundraising]
      summary: List all fundraising entries
      responses:
        "200":
          description: List of fundraising entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FundraisingEntry"
    post:
      operationId: createFundraising
      tags: [fundraising]
      summary: Create a fundraising entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFundraisingEntry"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundraisingEntry"

  /fundraising/{id}:
    put:
      operationId: updateFundraising
      tags: [fundraising]
      summary: Update a fundraising entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFundraisingEntry"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundraisingEntry"
    delete:
      operationId: deleteFundraising
      tags: [fundraising]
      summary: Delete a fundraising entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /logistics:
    get:
      operationId: listLogistics
      tags: [logistics]
      summary: List all logistics tasks
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of logistics tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogisticsTask"
    post:
      operationId: createLogisticsTask
      tags: [logistics]
      summary: Create a logistics task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLogisticsTask"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsTask"

  /logistics/{id}:
    put:
      operationId: updateLogisticsTask
      tags: [logistics]
      summary: Update a logistics task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLogisticsTask"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsTask"
    delete:
      operationId: deleteLogisticsTask
      tags: [logistics]
      summary: Delete a logistics task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all matches
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Create a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatch"
      responses:
        "201":
          description: Created match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}:
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatch"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    delete:
      operationId: deleteMatch
      tags: [matches]
      summary: Delete a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sponsors:
    get:
      operationId: listSponsors
      tags: [sponsors]
      summary: List all sponsors
      responses:
        "200":
          description: List of sponsors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sponsor"
    post:
      operationId: createSponsor
      tags: [sponsors]
      summary: Create a sponsor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSponsor"
      responses:
        "201":
          description: Created sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"

  /sponsors/{id}:
    put:
      operationId: updateSponsor
      tags: [sponsors]
      summary: Update a sponsor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSponsor"
      responses:
        "200":
          description: Updated sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
    delete:
      operationId: deleteSponsor
      tags: [sponsors]
      summary: Delete a sponsor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SendTravelRemindersBody:
      type: object
      properties:
        playerIds:
          type: array
          items:
            type: integer
          description: Specific player IDs to email. If omitted, emails all players missing flight info.

    TravelReminderResult:
      type: object
      properties:
        sent:
          type: integer
        failed:
          type: integer
        total:
          type: integer
      required:
        - sent
        - failed
        - total

    SendOnboardingInvitesBody:
      type: object
      properties:
        playerIds:
          type: array
          items:
            type: integer
          description: Specific player IDs to email. If omitted, emails all players who have not yet been sent an onboarding invite.

    OnboardingInviteResult:
      type: object
      properties:
        sent:
          type: integer
        failed:
          type: integer
        skippedNoEmail:
          type: integer
        total:
          type: integer
      required:
        - sent
        - failed
        - total

    SendFeeRemindersBody:
      type: object
      properties:
        playerIds:
          type: array
          items:
            type: integer
          description: Specific player IDs to email. If omitted, emails all players whose fee is unpaid.

    FeeReminderResult:
      type: object
      properties:
        sent:
          type: integer
        failed:
          type: integer
        total:
          type: integer
      required:
        - sent
        - failed
        - total

    DashboardStats:
      type: object
      properties:
        totalPlayers:
          type: integer
        playersPaidCount:
          type: integer
        feesAmountDue:
          type: number
        feesAmountPaid:
          type: number
        feesAmountOutstanding:
          type: number
        upcomingMatchCount:
          type: integer
        nextMatchKickoffAt:
          type: string
          nullable: true
        upcomingEventCount:
          type: integer
        nextEventStartsAt:
          type: string
          nullable: true
        nextEventTitle:
          type: string
          nullable: true
        documentCounts:
          type: object
          properties:
            total:
              type: integer
            mandatory:
              type: integer
            regulation:
              type: integer
            information:
              type: integer
          required:
            - total
            - mandatory
            - regulation
            - information
        teamStats:
          type: array
          items:
            type: object
            properties:
              teamId:
                type: integer
              teamName:
                type: string
              category:
                type: string
              playerCount:
                type: integer
              feesPaid:
                type: integer
              feesOutstanding:
                type: integer
            required:
              - teamId
              - teamName
              - category
              - playerCount
              - feesPaid
              - feesOutstanding
        totalFundsRaised:
          type: number
        fundraisingTarget:
          type: number
        upcomingDeadlines:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              dueDate:
                type: string
              category:
                type: string
            required:
              - title
              - dueDate
              - category
      required:
        - totalPlayers
        - playersPaidCount
        - feesAmountDue
        - feesAmountPaid
        - feesAmountOutstanding
        - upcomingMatchCount
        - upcomingEventCount
        - documentCounts
        - teamStats
        - totalFundsRaised
        - fundraisingTarget
        - upcomingDeadlines

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        managerName:
          type: string
        managerEmail:
          type: string
        managerPhone:
          type: string
        assistantManagerName:
          type: string
        assistantManagerContact:
          type: string
        whatsappGroupLink:
          type: string
        targetPlayerCount:
          type: integer
        kitNotes:
          type: string
        notes:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - category
        - managerName
        - managerEmail
        - managerPhone

    CreateTeam:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        managerName:
          type: string
        managerEmail:
          type: string
        managerPhone:
          type: string
        assistantManagerName:
          type: string
        assistantManagerContact:
          type: string
        whatsappGroupLink:
          type: string
        targetPlayerCount:
          type: integer
        kitNotes:
          type: string
        notes:
          type: string
      required:
        - name
        - category
        - managerName
        - managerEmail
        - managerPhone

    Player:
      type: object
      properties:
        id:
          type: integer
        teamId:
          type: integer
        teamName:
          type: string
        name:
          type: string
        shirtNumber:
          type: integer
        email:
          type: string
        phone:
          type: string
        position:
          type: string
        dateOfBirth:
          type: string
        nationality:
          type: string
        passportNumber:
          type: string
        passportExpiry:
          type: string
        passportCopyUrl:
          type: string
          nullable: true
        passportCopyReviewed:
          type: boolean
          nullable: true
        passportCopyUploadedAt:
          type: string
          nullable: true
        passportCopyUploadedIsUpdate:
          type: boolean
          nullable: true
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
        flightArrivalDateTime:
          type: string
        flightDepartureDateTime:
          type: string
        arrivalCity:
          type: string
        outboundFlightNumber:
          type: string
        outboundDepartureDateTime:
          type: string
        returnFlightNumber:
          type: string
        returnArrivalDateTime:
          type: string
        roomSharingPreference:
          type: string
        roomSharingWith:
          type: string
        shirtSize:
          type: string
        shortsSize:
          type: string
        jacketSize:
          type: string
        poloSize:
          type: string
        trackTopSize:
          type: string
        goalieSmockSize:
          type: string
        travelDates:
          type: string
        feePaid:
          type: boolean
        paymentAmountDue:
          type: number
        paymentAmountPaid:
          type: number
        paymentDate:
          type: string
        dietaryRequirements:
          type: string
        medicalNotes:
          type: string
        notes:
          type: string
        travelReminderSentAt:
          type: string
          nullable: true
        feeReminderSentAt:
          type: string
          nullable: true
        onboardingInviteSentAt:
          type: string
          nullable: true
        lastLoginAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - teamId
        - name
        - email
        - feePaid

    CreatePlayer:
      type: object
      properties:
        teamId:
          type: integer
